[workspace]
resolver = "3"
members = ["crates/desy-core", "crates/desy-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/Sprowll/Desy"
publish = false

[workspace.dependencies]
desy-core = { path = "crates/desy-core" }
kurbo = { version = "0.13", features = ["serde"] }
linesweeper = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
fontdb = "0.24"
ttf-parser = "0.25"
gpui-kit = "0.11"
anyhow = "1"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 3
debug = false
