# cargo-deny: https://embarkstudios.github.io/cargo-deny/
# `cargo deny check` runs in CI (.github/workflows/security.yml).

[graph]
all-features = false

[advisories]
# Fail on any RustSec vulnerability; unmaintained/unsound crates are reported too.
version = 2
yanked = "deny"
# Unmaintained crates only fail the check when Desy depends on them directly.
unmaintained = "workspace"
ignore = [
    # ttf-parser is unmaintained (no known vulnerability). Text-to-outline
    # conversion depends on it; replacing it (e.g. with skrifa) is tracked separately.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained only, no vulnerability; migration pending" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Licenses accepted for dependencies (all compatible with redistributing Desy).
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
# Desy's own crates are not published (publish = false).
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
